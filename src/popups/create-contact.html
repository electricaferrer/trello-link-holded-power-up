<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear contacto</title>
  <style>
    :root {
      color-scheme: light dark;
      --cc-text: #172b4d;
      --cc-border: #091e4224;
      --cc-border-strong: #091e4240;
      --cc-divider: #091e420f;
      --cc-input-bg: #ffffff;
      --cc-accent: #0079bf;
      --cc-accent-hover: #026aa7;
      --cc-on-accent: #ffffff;
      --cc-muted: #626f86;
      --cc-danger: #ae2e24;
      --cc-danger-bg: #ffeceb;
      --cc-disabled-bg: #091e4224;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 8px;
      background: transparent;
      color: var(--cc-text);
    }
    .form-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-row {
      display: flex;
      gap: 6px;
    }
    .form-row > * { flex: 1; min-width: 0; }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--cc-muted);
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    input, select {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid var(--cc-border);
      border-radius: 3px;
      font-size: 14px;
      box-sizing: border-box;
      background: var(--cc-input-bg);
      color: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      border-color: var(--cc-accent);
    }
    input::placeholder { color: var(--cc-muted); }
    .required input, .required select { border-color: var(--cc-border-strong); }
    .required-one input { border-color: var(--cc-border-strong); }
    input.invalid { border-color: var(--cc-danger); }
    .duplicate-msg {
      font-size: 11px;
      color: var(--cc-danger);
      margin-top: 2px;
      display: none;
    }
    .toggle-group {
      display: flex;
      border-radius: 3px;
      overflow: hidden;
      border: 1px solid var(--cc-border);
    }
    .toggle-group button {
      flex: 1;
      padding: 6px 8px;
      border: none;
      background: transparent;
      font-size: 13px;
      cursor: pointer;
      color: var(--cc-muted);
      transition: background 0.1s, color 0.1s;
    }
    .toggle-group button.active {
      background: var(--cc-accent);
      color: var(--cc-on-accent);
    }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--cc-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-top: 6px;
      padding-bottom: 2px;
      border-bottom: 1px solid var(--cc-divider);
    }
    .submit-btn {
      width: 100%;
      padding: 8px;
      margin-top: 8px;
      border: none;
      border-radius: 3px;
      background: var(--cc-accent);
      color: var(--cc-on-accent);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.1s;
    }
    .submit-btn:hover { background: var(--cc-accent-hover); }
    .submit-btn:disabled {
      background: var(--cc-disabled-bg);
      color: var(--cc-muted);
      cursor: not-allowed;
    }
    .error-msg {
      margin-top: 6px;
      padding: 6px 8px;
      background: var(--cc-danger-bg);
      color: var(--cc-danger);
      border-radius: 3px;
      font-size: 13px;
      display: none;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --cc-text: #b6c2cf;
        --cc-border: #a6c5e229;
        --cc-border-strong: #a6c5e240;
        --cc-divider: #a6c5e229;
        --cc-input-bg: #22272b;
        --cc-accent: #579dff;
        --cc-accent-hover: #85b8ff;
        --cc-on-accent: #1d2125;
        --cc-muted: #8c9bab;
        --cc-danger: #f87168;
        --cc-danger-bg: #42221f;
        --cc-disabled-bg: #a6c5e229;
      }
    }
  </style>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
  <div class="form-grid" id="form">
    <div class="form-row">
      <div class="required">
        <label>Nombre *</label>
        <input type="text" id="name" placeholder="Nombre completo o razón social" autofocus />
      </div>
      <div class="required">
        <label>DNI / CIF *</label>
        <input type="text" id="code" placeholder="12345678A / B12345678" />
        <div class="duplicate-msg" id="code-duplicate-msg"></div>
      </div>
    </div>

    <div class="required">
      <label>Tipo *</label>
      <div class="toggle-group" id="type-toggle">
        <button type="button" data-value="empresa">Empresa</button>
        <button type="button" data-value="persona">Persona</button>
      </div>
    </div>

    <div class="section-title">Contacto (al menos uno) *</div>

    <div class="form-row">
      <div class="required-one">
        <label>Email</label>
        <input type="email" id="email" placeholder="email@ejemplo.com" />
      </div>
      <div class="required-one">
        <label>Teléfono</label>
        <input type="tel" id="phone" placeholder="971 000 000" />
      </div>
    </div>

    <div class="section-title">Dirección</div>

    <div class="required">
      <label>Dirección *</label>
      <input type="text" id="address" placeholder="Calle, número, piso..." />
    </div>
    <div class="form-row">
      <div class="required">
        <label>Población *</label>
        <input type="text" id="city" placeholder="Población" />
      </div>
      <div class="required">
        <label>Código postal *</label>
        <input type="text" id="postalCode" placeholder="07000" />
      </div>
    </div>
    <div class="form-row">
      <div class="required">
        <label>Provincia *</label>
        <input type="text" id="province" placeholder="Provincia" />
      </div>
      <div>
        <label>País</label>
        <input type="text" id="country" value="España" />
      </div>
    </div>

    <button type="button" class="submit-btn" id="submit-btn">Crear contacto</button>
    <div class="error-msg" id="error-msg"></div>
  </div>
  <script type="module" src="./create-contact.ts"></script>
</body>
</html>
